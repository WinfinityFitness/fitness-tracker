<!-- Coach Portal preview trigger for winfinityfitness.com (WordPress) --
     paste this whole block into a Custom HTML widget/block directly under
     the existing "Open Coach Portal" button in the FOR COACHES card.
     Fragment, not a full page, same convention as hero-embed.html/
     footer-embed.html -- inherits the page's own width.

     Tapping the text link opens a full-screen takeover iframing
     coach-portal.html?demo=1 -- a fully interactive but entirely local/
     synthetic "Coach" session (sample branding, 5 sample clients, fake
     60-day histories) with no real login and no Supabase writes, so a
     prospective coach can actually tap around the real UI instead of
     looking at static screenshots. See coach-portal.html's own demoMode
     block for how that side works. Full-viewport on both mobile and
     desktop (not a small modal/phone-frame card) so it reads as the app
     actually opening, not a preview floating over the marketing page --
     just a floating close button pinned top-right.

     iframe points at the GitHub Pages URL directly (not the
     winfinityfitness.com/coach-portal proxy path) -- same convention
     hero-embed.html uses for its own asset URLs, and avoids depending on
     the PHP proxy just to preview the thing that proxy also serves. -->
<p class="wf-coach-preview-trigger">
  <button type="button" id="wfCoachPreviewBtn">Coach Portal Preview <span aria-hidden="true">click this</span></button>
</p>

<div class="wf-coach-preview-overlay" id="wfCoachPreviewOverlay" hidden>
  <button type="button" class="wf-coach-preview-close" id="wfCoachPreviewClose" aria-label="Close preview">&times;</button>
  <iframe id="wfCoachPreviewFrame" title="Winfinity Coach Portal preview" loading="lazy"
    src="about:blank" data-src="https://winfinityfitness.github.io/fitness-tracker/coach-portal.html?demo=1"></iframe>
</div>

<!-- CSS/JS hosted externally, not inline -- WordPress's content pipeline
     can silently rewrite plain quote characters wherever it finds them in
     pasted content (harmless in prose, but it turns 'Segoe UI' or a JS
     string literal's quotes into curly smart quotes and breaks them). A
     <link>/<script src> pointing at GitHub Pages is immune to that, same
     reasoning as arsenal-embed.html's external arsenal-embed.js. -->
<link rel="stylesheet" href="https://winfinityfitness.github.io/fitness-tracker/coach-preview-embed.css">
<script src="https://winfinityfitness.github.io/fitness-tracker/coach-preview-embed.js"></script>
