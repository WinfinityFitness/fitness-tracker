<!-- Winfinity hero embed for winfinityfitness.com (WordPress) — paste this
     whole block into a Custom HTML widget/block wherever the hero/top
     section should go. Fragment, not a full page, same convention as
     footer-embed.html -- inherits the page's own width.

     CTA button ("Launch Nexus") is a fixed, static link straight to the
     live Wellness dashboard -- deliberately NOT synced to the Digital
     Arsenal's Wellness download-icon link (ad_settings.download_url_
     wellness), which points at the installer file instead. Two different
     destinations by design: this button launches the live app, Arsenal's
     downloads the installer. No Supabase fetch needed here at all.

     Second CTA ("Fitness Adventure") links to adventure.winfinityfitness.com
     -- a standalone static page (adventure-guide.html in the fitness-tracker
     repo, served through the same wordpress-proxy used by Wellness/Messenger,
     see wordpress-proxy/index.php's host branch) walking through the in-app
     Fitness RPG / Adventure Map feature. Outline style so it reads as the
     secondary action next to Launch Nexus.

     Background music (#wfMusicWidget): starts muted+autoplay (the one
     autoplay mode every browser allows without a prior user gesture) so
     the loop is already running the instant someone unmutes -- there's no
     click-to-first-play delay. The floating control is a plain toggle +
     volume slider fixed to the vertical middle of the viewport, same
     "top:50%, docked to an edge" convention the FT app's own admin-drawer
     tab uses for its floating launcher. Unmuting on first tap also nudges
     volume up from 0 if the slider was left at its default, so pressing
     the speaker icon alone is enough to actually hear something. -->
<audio id="wfMusicAudio" src="https://winfinityfitness.github.io/fitness-tracker/audio/webpage-bg-music.m4a" loop autoplay muted playsinline></audio>
<div class="wf-music-widget" id="wfMusicWidget">
  <button type="button" class="wf-music-toggle" id="wfMusicToggle" aria-label="Unmute background music" title="Unmute music">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="4 9 8 9 12 5 12 19 8 15 4 15"/><line x1="17" y1="8" x2="22" y2="16"/><line x1="22" y1="8" x2="17" y2="16"/></svg>
  </button>
  <input type="range" id="wfMusicVolume" class="wf-music-volume" min="0" max="100" value="60" aria-label="Music volume">
</div>
<!-- Voice narration for the prologue caption below -- a single ~60s clip,
     not a loop. Browsers block non-muted autoplay outright, so playback
     is deferred to the visitor's first click/tap anywhere on the page
     (see the caption script below) rather than attempted at load, which
     left the element stuck in a permanent error state in testing. The
     caption's own line timings only start once narration actually
     begins, so text and voice always start together. -->
<audio id="wfNarration" src="https://winfinityfitness.github.io/fitness-tracker/audio/ring-verse-narration.mp3" preload="auto" playsinline></audio>

<section class="wf-hero-embed" id="wfHeroEmbed">
  <!-- Decorative flanking characters -- pre-processed (vignette-faded to
       transparent at the edges + darkened) offline rather than at CSS/
       runtime, so there's no per-visitor blend cost and the fade is exact
       regardless of what sits behind it. aria-hidden + empty alt since
       they're pure atmosphere, not content. -->
  <div class="wf-hero-side-clip wf-hero-side-clip--left">
    <img class="wf-hero-side-char wf-hero-side-char--left" src="https://winfinityfitness.github.io/fitness-tracker/icons/hero-fighter.png" alt="" aria-hidden="true">
  </div>
  <div class="wf-hero-side-clip wf-hero-side-clip--right">
    <img class="wf-hero-side-char wf-hero-side-char--right" src="https://winfinityfitness.github.io/fitness-tracker/icons/hero-knight.png" alt="" aria-hidden="true">
  </div>
  <div class="wf-hero-content">
    <img class="wf-hero-logo" src="https://winfinityfitness.github.io/fitness-tracker/icons/wf-logo-3d.png" alt="Winfinity">
    <h1 class="wf-hero-title">The Future Of<br><em>Performance</em></h1>
    <!-- Prologue-style cycling caption, synced to and repeating with the
         narration clip below (see the caption script near the bottom of
         this file) -- one line fades in, holds, fades out, then the
         next, looping back to the first line 7s after the narration
         ends. Reserves its own min-height (see .wf-hero-caption) so the
         CTA row below doesn't jump as lines change length. -->
    <div class="wf-hero-caption" id="wfHeroCaption" aria-live="polite"></div>
    <div class="wf-hero-cta-row">
      <a class="wf-hero-cta" href="https://wellness.winfinityfitness.com" target="_blank" rel="noopener">Launch Nexus</a>
      <a class="wf-hero-cta wf-hero-cta--ghost" href="https://adventure.winfinityfitness.com" target="_blank" rel="noopener">Fitness Adventure</a>
    </div>
  </div>
</section>

<style>
  .wf-hero-embed {
    background: #0a0d12; text-align: center; padding: 64px 24px 72px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    position: relative; overflow: hidden; min-height: 640px;
    display: flex; align-items: center; justify-content: center;
  }
  /* min-width:0 overrides a flex item's default min-width:auto, which
     otherwise refuses to shrink below its text content's intrinsic width
     -- without this, turning .wf-hero-embed into a flex container (for
     centering the side characters) silently broke text wrapping on
     narrow viewports, overflowing past the section instead of wrapping. */
  .wf-hero-content { position: relative; z-index: 2; min-width: 0; max-width: 100%; }
  /* Flanking characters -- absolutely positioned behind the content,
     bottom-aligned so their feet sit at the section's own bottom edge.
     Height-based sizing (not width) keeps both proportional to the
     section's height regardless of viewport width -- the fighter's crop
     is nearly square while the knight's is tall and narrow, so a %-width
     cap would clamp one before the other and force object-fit:contain to
     shrink just that one's height to comply, breaking the eye/toe
     alignment between them. Two different-aspect-ratio images only stay
     aligned if height is the only sizing constraint in play.

     The logo must never be crossed, though -- so each character sits in
     its own clipping wrapper whose boundary is fixed to the logo's own
     edge (50% +/- half its 252px width), rather than shrinking to fit.
     Anything past that boundary (the fighter's raised knee, at typical
     widths) is clipped by the wrapper's overflow:hidden instead of
     scaling the whole figure down -- explicitly fine per the brief. */
  .wf-hero-side-clip {
    position: absolute; top: 0; bottom: 0; overflow: hidden;
    pointer-events: none; z-index: 1;
  }
  .wf-hero-side-clip--left { left: 0; width: max(0px, calc(50% - 126px)); }
  .wf-hero-side-clip--right { right: 0; width: max(0px, calc(50% - 126px)); }
  .wf-hero-side-char {
    position: absolute; bottom: 0; height: 96%; width: auto;
    object-fit: contain; user-select: none;
  }
  /* Anchored to the INNER edge (facing the logo), not the outer/page
     edge -- the two characters have very different natural widths at
     the same height (knight's crop is much wider than the gym guy's
     narrower one), so anchoring outer-edge left the narrower one
     stranded far from the logo while the wider one crowded right up
     against it. Anchoring inner-edge instead means both sit the same
     distance from the logo regardless of their own width; any excess
     width extends outward, where the clip wrapper still guards it. */
  .wf-hero-side-char--left { right: 0; object-position: right bottom; }
  .wf-hero-side-char--right { left: 0; object-position: left bottom; }
  @media (max-width: 900px) {
    .wf-hero-side-char { opacity: 0.55; height: 82%; }
  }
  @media (max-width: 640px) {
    /* No room to flank the centered content once the layout this tight --
       they'd crowd the headline rather than read as atmosphere. */
    .wf-hero-side-clip { display: none; }
    .wf-hero-embed { min-height: 0; }
  }
  .wf-hero-logo {
    /* Sized to match the Adventure guide's hero seal (.hero-seal-frame,
       adventure-guide.html) so the same logo reads consistently large
       across both pages. */
    width: 252px; height: 252px; object-fit: contain; margin: 0 auto 28px; display: block;
    animation: wf-hero-glow-pulse 2.4s ease-in-out infinite alternate;
  }
  @keyframes wf-hero-glow-pulse {
    from { filter: drop-shadow(0 0 10px rgba(255,159,67,0.4)); }
    to   { filter: drop-shadow(0 0 26px rgba(255,159,67,0.85)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .wf-hero-logo { animation: none; filter: drop-shadow(0 0 18px rgba(255,159,67,0.55)); }
  }
  /* !important + explicit font-family throughout, same defensive pattern
     as .wf-footer-name -- WordPress themes commonly re-style bare h1-h6
     (and em inside them) with their own font-family/font-style/color at
     higher specificity than a single class can beat on its own. */
  .wf-hero-embed .wf-hero-title {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
    color: #e8ecf1 !important; font-size: clamp(1.8rem, 5vw, 2.6rem) !important; font-weight: 800 !important;
    font-style: normal !important; text-transform: uppercase; line-height: 1.2; margin: 0 0 18px; letter-spacing: 0.04em;
  }
  .wf-hero-embed .wf-hero-title em {
    font-family: inherit !important; display: block; color: #ff9f43 !important;
    font-style: normal !important; font-weight: 800 !important;
  }
  /* Prologue caption -- fixed min-height reserves space for the tallest
     line up front so the CTA row below doesn't jump vertically as shorter/
     longer lines swap in (see wfHeroCaptionInit). */
  .wf-hero-caption {
    min-height: 3.2em; max-width: 520px; margin: 0 auto 32px;
    display: flex; align-items: center; justify-content: center; padding: 0 8px;
  }
  .wf-hero-caption-line {
    margin: 0; color: #b9c2cf; font-size: 0.95rem; font-style: italic; line-height: 1.6;
    opacity: 0; transition: opacity 1s ease;
  }
  .wf-hero-caption-line.is-visible { opacity: 1; }
  .wf-hero-caption-line.is-final {
    color: #ff9f43; font-weight: 800; font-style: normal; text-transform: uppercase;
    letter-spacing: 0.05em; font-size: 1.05rem;
  }
  @media (prefers-reduced-motion: reduce) {
    .wf-hero-caption-line { transition: none; }
  }
  .wf-hero-cta-row {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 16px;
  }
  .wf-hero-cta {
    display: inline-block; background: #ff9f43; color: #0a0d12; text-decoration: none;
    font-weight: 700; font-size: 0.85rem; letter-spacing: 0.03em; text-transform: uppercase;
    padding: 14px 32px; clip-path: polygon(4% 0, 100% 0, 96% 100%, 0 100%);
    box-sizing: border-box; min-width: 230px; text-align: center; position: relative;
  }
  .wf-hero-cta:hover { background: #ffb668; }
  /* A real border/box-shadow can't follow clip-path's diagonal cut edges
     at all -- clip-path only crops pixels, it never draws a stroke along
     the new cut line, so both approaches leave the slanted sides bare
     (the bug in the last fix). The only way to get an outline that
     actually follows every edge, including the diagonals, is a "clipped
     picture frame": this element's own background IS the outline color
     (inheriting .wf-hero-cta's orange fill + clip-path above), and a
     ::before inset by the border width, clipped to the same shape, sits
     on top in the page's own background color to punch out the middle. */
  .wf-hero-cta--ghost { color: #ff9f43 !important; }
  .wf-hero-cta--ghost::before {
    content: ''; position: absolute; inset: 1.5px; z-index: -1;
    background: #0a0d12; clip-path: polygon(4% 0, 100% 0, 96% 100%, 0 100%);
  }
  .wf-hero-cta--ghost:hover::before { background: #271d1b; }

  /* Floating music control -- fixed to the vertical middle of the
     viewport (top:50%), docked to the right edge. z-index kept modest
     (999) since this is a WordPress page with its own header/nav that
     may need to sit above it, unlike the FT app's own full-screen
     overlays. */
  .wf-music-widget {
    position: fixed; top: 50%; right: 14px; transform: translateY(-50%);
    z-index: 999; display: flex; flex-direction: column; align-items: center; gap: 10px;
    background: rgba(10,13,18,0.88); border: 1px solid rgba(255,159,67,0.35);
    border-radius: 999px; padding: 14px 9px;
    box-shadow: 0 10px 26px rgba(0,0,0,0.4);
    backdrop-filter: blur(6px);
  }
  .wf-music-toggle {
    width: 34px; height: 34px; border-radius: 50%; border: none; cursor: pointer;
    background: #ff9f43; color: #0a0d12;
    display: flex; align-items: center; justify-content: center; flex: none;
    transition: background 0.15s ease;
  }
  .wf-music-toggle:hover { background: #ffb668; }
  .wf-music-toggle.is-muted { background: transparent; color: #ff9f43; box-shadow: inset 0 0 0 1.5px #ff9f43; }
  /* Vertical slider -- rotating a plain horizontal <input type=range> is
     far more consistent across browsers than the nonstandard
     writing-mode/orient="vertical" routes, which render inconsistently
     (particularly on iOS Safari, a WordPress visitor's likely browser). */
  .wf-music-volume {
    writing-mode: vertical-lr; direction: rtl; appearance: none; -webkit-appearance: none;
    width: 5px; height: 84px; background: rgba(255,255,255,0.18); border-radius: 999px;
    outline: none; cursor: pointer; margin: 0;
  }
  .wf-music-volume::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; border-radius: 50%; background: #ff9f43;
    border: 2px solid #0a0d12; cursor: pointer;
  }
  .wf-music-volume::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%; background: #ff9f43;
    border: 2px solid #0a0d12; cursor: pointer;
  }
  @media (max-width: 640px) {
    .wf-music-widget { right: 8px; padding: 12px 7px; gap: 8px; }
    .wf-music-volume { height: 64px; }
  }
</style>

<script>
(function () {
  var audio = document.getElementById('wfMusicAudio');
  var toggle = document.getElementById('wfMusicToggle');
  var volume = document.getElementById('wfMusicVolume');
  if (!audio || !toggle || !volume) return;

  var MUTE_KEY = 'wf_hero_music_muted';
  var VOL_KEY = 'wf_hero_music_volume';
  var ICON_MUTED = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="4 9 8 9 12 5 12 19 8 15 4 15"/><line x1="17" y1="8" x2="22" y2="16"/><line x1="22" y1="8" x2="17" y2="16"/></svg>';
  var ICON_ON = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="4 9 8 9 12 5 12 19 8 15 4 15"/><path d="M17 8a5 5 0 0 1 0 8"/><path d="M20 5a9 9 0 0 1 0 14"/></svg>';

  var storedVol = localStorage.getItem(VOL_KEY);
  var vol = storedVol !== null ? parseInt(storedVol, 10) : 60;
  if (isNaN(vol)) vol = 60;
  volume.value = vol;
  audio.volume = vol / 100;

  // Starts muted (see the <audio> tag's own muted+autoplay -- the one
  // autoplay mode every browser allows without a prior click) unless the
  // visitor previously unmuted, in which case honor that straight away.
  var muted = localStorage.getItem(MUTE_KEY) !== '0';

  function applyState() {
    audio.muted = muted;
    toggle.classList.toggle('is-muted', muted);
    var label = muted ? 'Unmute background music' : 'Mute background music';
    toggle.setAttribute('aria-label', label);
    toggle.title = label.replace(' background', '');
    toggle.innerHTML = muted ? ICON_MUTED : ICON_ON;
  }
  applyState();

  toggle.addEventListener('click', function () {
    muted = !muted;
    localStorage.setItem(MUTE_KEY, muted ? '1' : '0');
    applyState();
    // A real click, so play() sits inside a user gesture -- covers browsers
    // that paused the muted autoplay loop outright rather than letting it
    // keep running silently in the background.
    audio.play().catch(function () {});
  });

  volume.addEventListener('input', function () {
    var v = parseInt(volume.value, 10);
    audio.volume = v / 100;
    localStorage.setItem(VOL_KEY, String(v));
  });
})();

// Prologue-style caption: one line fades in, holds, fades out, then the
// next -- including the tagline line, which now also fades out once the
// narration actually ends rather than staying put forever (see the
// 'ended' listener below). Respects prefers-reduced-motion by skipping
// straight to a static final line with no cycling and no narration at
// all, same as the logo's own pulse animation does elsewhere on this page.
//
// Paced against the ~60s narration clip (see #wfNarration): three holds
// of HOLD_MS land the final line around the 42s mark, leaving the voice
// room to finish speaking it before falling silent. There's no per-word
// timestamp data for the recording, so this is an even, not word-exact,
// split -- nudge HOLD_MS if a line visibly drifts ahead of or behind the
// voice once previewed against the actual audio.
//
// The whole thing repeats indefinitely: when narration hits 'ended', the
// caption fades out immediately and both narration and captions restart
// together after REPEAT_GAP_MS of silence, so the two never drift apart
// across repeats the way independent timers eventually would.
(function () {
  var container = document.getElementById('wfHeroCaption');
  var narration = document.getElementById('wfNarration');
  if (!container) return;

  var LINES = [
    'Long ago, the Apps of Power were forged and scattered among the seekers of many kingdoms&hellip;',
    'One for Progress. One for Calories. One for Cardio. Scattered, and alone.',
    'Then, in secret, in the fire of Mount Doom&hellip;',
    'One App was forged to rule them all.'
  ];
  var HOLD_MS = 13000;
  var FADE_MS = 1000;
  var REPEAT_GAP_MS = 7000;

  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduceMotion) {
    var finalLine = document.createElement('p');
    finalLine.className = 'wf-hero-caption-line is-final is-visible';
    finalLine.innerHTML = LINES[LINES.length - 1];
    container.appendChild(finalLine);
    return;
  }

  var i = 0;
  function showLine() {
    var isLast = i === LINES.length - 1;
    var p = document.createElement('p');
    p.className = 'wf-hero-caption-line' + (isLast ? ' is-final' : '');
    p.innerHTML = LINES[i];
    container.innerHTML = '';
    container.appendChild(p);
    // Fade-in needs the opacity:0 state to actually paint first -- adding
    // is-visible in the same tick as appending the element would let the
    // browser coalesce both into one paint with no transition to animate.
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { p.classList.add('is-visible'); });
    });
    // The final line no longer schedules its own fade-out here -- with
    // no narration to key off of, it just holds indefinitely until (if
    // ever) a 'narration ended' event drives the repeat below.
    if (isLast) return;
    setTimeout(function () {
      p.classList.remove('is-visible');
      setTimeout(function () { i++; showLine(); }, FADE_MS);
    }, HOLD_MS);
  }

  var started = false;
  function start() {
    if (started) return;
    started = true;
    i = 0;
    showLine();
  }

  if (!narration) { start(); return; }

  // Unmuted audio can't autoplay in any real browser, so there's no point
  // attempting play() before a gesture -- every browser rejects it, and
  // doing so anyway risks leaving the element in a broken error state that
  // a later retry on the same element doesn't reliably recover from. Wait
  // for the visitor's first tap/click anywhere on the page instead, then
  // start narration and captions together so they never drift apart.
  var kicked = false;
  function kick() {
    if (kicked) return;
    kicked = true;
    document.removeEventListener('click', kick);
    document.removeEventListener('touchstart', kick);
    narration.play().catch(function () {});
    start();
  }
  document.addEventListener('click', kick, { once: true });
  document.addEventListener('touchstart', kick, { once: true });

  // Not the native <audio loop> attribute -- that repeats with zero gap,
  // and the brief wants a 7s pause of silence between reads. 'ended' only
  // fires with loop absent, so this is also what makes the manual repeat
  // possible at all.
  narration.addEventListener('ended', function () {
    var line = container.querySelector('.wf-hero-caption-line');
    if (line) line.classList.remove('is-visible');
    setTimeout(function () {
      narration.currentTime = 0;
      narration.play().catch(function () {});
      i = 0;
      showLine();
    }, REPEAT_GAP_MS);
  });
})();
</script>
