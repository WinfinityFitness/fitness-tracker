<!-- Winfinity hero embed for winfinityfitness.com (WordPress) -->
<audio id="wfMusicAudio" src="https://winfinityfitness.github.io/fitness-tracker/audio/webpage-bg-music.m4a" loop autoplay muted playsinline></audio>
<audio id="wfNarration" src="https://winfinityfitness.github.io/fitness-tracker/audio/ring-verse-narration.mp3" preload="auto" playsinline></audio>

<div class="wf-music-widget" id="wfMusicWidget">
  <!-- Background Music: icon-only until tapped, then it pops its own
       volume+mute panel out to the side (matches the BirthdayEMA/
       adventure-guide.html pattern instead of an always-visible pill). -->
  <div class="wf-audio-control-group">
    <button type="button" class="wf-music-toggle" id="wfMusicToggle" aria-label="Show music volume" aria-expanded="false" title="Music">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="4 9 8 9 12 5 12 19 8 15 4 15"/><path d="M17 8a5 5 0 0 1 0 8"/><path d="M20 5a9 9 0 0 1 0 14"/></svg>
    </button>
    <div class="wf-audio-panel" id="wfMusicPanel" hidden>
      <input type="range" id="wfMusicVolume" class="wf-music-volume" min="0" max="100" value="60" aria-label="Music volume">
      <button type="button" class="wf-audio-mute-btn" id="wfMusicMuteBtn" aria-label="Mute background music" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="4 9 8 9 12 5 12 19 8 15 4 15"/><path d="M17 8a5 5 0 0 1 0 8"/></svg>
      </button>
    </div>
  </div>

  <!-- Narration: same icon-tap pattern, independent mute+volume. -->
  <div class="wf-audio-control-group">
    <button type="button" class="wf-music-toggle" id="wfNarrationToggle" aria-label="Show narration volume" aria-expanded="false" title="Narration">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
    </button>
    <div class="wf-audio-panel" id="wfNarrationPanel" hidden>
      <input type="range" id="wfNarrationVolume" class="wf-music-volume" min="0" max="100" value="80" aria-label="Narration volume">
      <button type="button" class="wf-audio-mute-btn" id="wfNarrationMuteBtn" aria-label="Mute narration" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      </button>
    </div>
  </div>
</div>

<section class="wf-hero-embed" id="wfHeroEmbed">
  <div class="wf-hero-side-clip wf-hero-side-clip--left">
    <img class="wf-hero-side-char wf-hero-side-char--left" src="https://winfinityfitness.github.io/fitness-tracker/icons/hero-fighter.png" alt="" aria-hidden="true">
  </div>
  <div class="wf-hero-side-clip wf-hero-side-clip--right">
    <img class="wf-hero-side-char wf-hero-side-char--right" src="https://winfinityfitness.github.io/fitness-tracker/icons/hero-knight.png" alt="" aria-hidden="true">
  </div>
  <div class="wf-hero-content">
    <img class="wf-hero-logo" src="https://winfinityfitness.github.io/fitness-tracker/icons/wf-logo-3d.png" alt="Winfinity">
    <h1 class="wf-hero-title">The Future Of<br><em>Performance</em></h1>
    <div class="wf-hero-caption" id="wfHeroCaption" aria-live="polite"></div>
    <div class="wf-hero-cta-row">
      <a class="wf-hero-cta" href="https://wellness.winfinityfitness.com" target="_blank" rel="noopener">Launch Nexus</a>
      <a class="wf-hero-cta wf-hero-cta--ghost" href="https://adventure.winfinityfitness.com" target="_blank" rel="noopener">Fitness Adventure</a>
    </div>
  </div>
</section>

<style>
  .wf-hero-embed {
    background: #0a0d12; text-align: center; padding: 64px 24px 72px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    position: relative; overflow: hidden; min-height: 640px;
    display: flex; align-items: center; justify-content: center;
  }
  .wf-hero-content { position: relative; z-index: 2; min-width: 0; max-width: 100%; }
  .wf-hero-side-clip {
    position: absolute; top: 0; bottom: 0; overflow: hidden;
    pointer-events: none; z-index: 1;
    transition: all 0.3s ease;
  }
  .wf-hero-side-clip--left { left: 0; width: max(0px, calc(50% - 126px)); }
  .wf-hero-side-clip--right { right: 0; width: max(0px, calc(50% - 126px)); }
  .wf-hero-side-char {
    position: absolute; bottom: 0; height: 96%; width: auto;
    object-fit: contain; user-select: none;
  }
  .wf-hero-side-char--left { right: 0; object-position: right bottom; }
  .wf-hero-side-char--right { left: 0; object-position: left bottom; }

  @media (max-width: 900px) {
    .wf-hero-side-char { opacity: 0.55; height: 82%; }
  }

  /* Mobile Layout - Move characters back-to-back behind center content */
  @media (max-width: 640px) {
    .wf-hero-embed { min-height: 560px; padding: 48px 16px 56px; }

    .wf-hero-side-clip--left {
      left: 50%;
      right: auto;
      width: 50%;
      transform: translateX(-100%);
    }
    .wf-hero-side-clip--right {
      right: 50%;
      left: auto;
      width: 50%;
      transform: translateX(100%);
    }

    .wf-hero-side-char {
      height: 75%;
      opacity: 0.35; /* Faded slightly on mobile so text remains crisp */
    }

    .wf-hero-side-char--left {
      right: 10px; /* Aligns left character near the center spine */
      object-position: right bottom;
    }
    .wf-hero-side-char--right {
      left: 10px; /* Aligns right character near the center spine */
      object-position: left bottom;
    }
  }

  .wf-hero-logo {
    width: 252px; height: 252px; object-fit: contain; margin: 0 auto 28px; display: block;
    animation: wf-hero-glow-pulse 2.4s ease-in-out infinite alternate;
  }
  @keyframes wf-hero-glow-pulse {
    from { filter: drop-shadow(0 0 10px rgba(255,159,67,0.4)); }
    to   { filter: drop-shadow(0 0 26px rgba(255,159,67,0.85)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .wf-hero-logo { animation: none; filter: drop-shadow(0 0 18px rgba(255,159,67,0.55)); }
  }
  .wf-hero-embed .wf-hero-title {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
    color: #e8ecf1 !important; font-size: clamp(1.8rem, 5vw, 2.6rem) !important; font-weight: 800 !important;
    font-style: normal !important; text-transform: uppercase; line-height: 1.2; margin: 0 0 18px; letter-spacing: 0.04em;
  }
  .wf-hero-embed .wf-hero-title em {
    font-family: inherit !important; display: block; color: #ff9f43 !important;
    font-style: normal !important; font-weight: 800 !important;
  }
  .wf-hero-caption {
    min-height: 3.2em; max-width: 520px; margin: 0 auto 32px;
    display: flex; align-items: center; justify-content: center; padding: 0 8px;
  }
  .wf-hero-caption-line {
    margin: 0; color: #b9c2cf; font-size: 0.95rem; font-style: italic; line-height: 1.6;
    opacity: 0; transition: opacity 1s ease;
  }
  .wf-hero-caption-line.is-visible { opacity: 1; }
  .wf-hero-caption-line.is-final {
    color: #ff9f43; font-weight: 800; font-style: normal; text-transform: uppercase;
    letter-spacing: 0.05em; font-size: 1.05rem;
  }
  @media (prefers-reduced-motion: reduce) {
    .wf-hero-caption-line { transition: none; }
  }
  .wf-hero-cta-row {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 16px;
  }
  .wf-hero-cta {
    display: inline-block; background: #ff9f43; color: #0a0d12; text-decoration: none;
    font-weight: 700; font-size: 0.85rem; letter-spacing: 0.03em; text-transform: uppercase;
    padding: 14px 32px; clip-path: polygon(4% 0, 100% 0, 96% 100%, 0 100%);
    box-sizing: border-box; min-width: 230px; text-align: center; position: relative;
  }
  .wf-hero-cta:hover { background: #ffb668; }
  .wf-hero-cta--ghost { color: #ff9f43 !important; }
  .wf-hero-cta--ghost::before {
    content: ''; position: absolute; inset: 1.5px; z-index: -1;
    background: #0a0d12; clip-path: polygon(4% 0, 100% 0, 96% 100%, 0 100%);
  }
  .wf-hero-cta--ghost:hover::before { background: #271d1b; }

  /* Audio Controls Widget Layout - icon-only stack, no pill grouping the
     two controls together. Each icon pops its own volume+mute panel out
     to the left when tapped, mirroring the pattern used on the
     BirthdayEMA invite and adventure-guide.html. */
  .wf-music-widget {
    position: fixed; top: 50%; right: 14px; transform: translateY(-50%);
    z-index: 999; display: flex; flex-direction: column; align-items: center; gap: 14px;
  }
  .wf-audio-control-group { position: relative; display: flex; }
  .wf-music-toggle {
    width: 34px; height: 34px; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(10,13,18,0.85); color: #ff9f43;
    display: flex; align-items: center; justify-content: center; flex: none;
    box-shadow: 0 6px 16px rgba(0,0,0,0.35), inset 0 0 0 1px rgba(255,159,67,0.4);
    transition: transform 0.15s ease;
  }
  .wf-music-toggle:hover { transform: scale(1.07); }
  .wf-music-toggle.is-muted { color: rgba(255,159,67,0.45); }
  .wf-audio-panel {
    position: absolute; top: 50%; right: calc(100% + 10px); transform: translateY(-50%);
    display: flex; align-items: center; gap: 8px;
    background: rgba(10,13,18,0.92); border: 1px solid rgba(255,159,67,0.35);
    border-radius: 999px; padding: 8px 10px;
    box-shadow: 0 10px 26px rgba(0,0,0,0.4);
    backdrop-filter: blur(6px);
  }
  .wf-audio-panel[hidden] { display: none; }
  .wf-audio-mute-btn {
    width: 22px; height: 22px; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(255,255,255,0.08); color: #ff9f43; flex: none;
    display: flex; align-items: center; justify-content: center;
  }
  .wf-audio-mute-btn.is-muted { background: #ff9f43; color: #0a0d12; }
  .wf-music-volume {
    -webkit-appearance: none; appearance: none;
    width: 90px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 999px;
    outline: none; cursor: pointer; margin: 0; accent-color: #ff9f43;
  }
  .wf-music-volume::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 13px; height: 13px; border-radius: 50%; background: #ff9f43;
    border: 2px solid #0a0d12; cursor: pointer;
  }
  .wf-music-volume::-moz-range-thumb {
    width: 13px; height: 13px; border-radius: 50%; background: #ff9f43;
    border: 2px solid #0a0d12; cursor: pointer;
  }
  @media (max-width: 640px) {
    .wf-music-widget { right: 8px; gap: 10px; }
  }
</style>

<script>
(function () {
  var audio = document.getElementById('wfMusicAudio');
  var toggle = document.getElementById('wfMusicToggle');
  var panel = document.getElementById('wfMusicPanel');
  var volume = document.getElementById('wfMusicVolume');
  var muteBtn = document.getElementById('wfMusicMuteBtn');

  var narration = document.getElementById('wfNarration');
  var narrToggle = document.getElementById('wfNarrationToggle');
  var narrPanel = document.getElementById('wfNarrationPanel');
  var narrVolume = document.getElementById('wfNarrationVolume');
  var narrMuteBtn = document.getElementById('wfNarrationMuteBtn');

  if (!audio || !toggle || !panel || !volume || !muteBtn || !narration || !narrToggle || !narrPanel || !narrVolume || !narrMuteBtn) return;

  // Local Storage Keys
  var MUSIC_MUTE_KEY = 'wf_hero_music_muted';
  var MUSIC_VOL_KEY = 'wf_hero_music_volume';
  var NARR_MUTE_KEY = 'wf_hero_narration_muted';
  var NARR_VOL_KEY = 'wf_hero_narration_volume';

  // SVG Icons (used only by each panel's dedicated mute button now --
  // the outer toggle icon stays fixed and just opens/closes the panel)
  var ICON_MUSIC_OFF = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="4 9 8 9 12 5 12 19 8 15 4 15"/><line x1="17" y1="8" x2="22" y2="16"/><line x1="22" y1="8" x2="17" y2="16"/></svg>';
  var ICON_MUSIC_ON = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="4 9 8 9 12 5 12 19 8 15 4 15"/><path d="M17 8a5 5 0 0 1 0 8"/></svg>';
  var ICON_NARR_OFF = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="1" x2="23" y2="23"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"/><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>';
  var ICON_NARR_ON = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>';

  function closePanels(except) {
    if (panel !== except) panel.hidden = true, toggle.setAttribute('aria-expanded', 'false');
    if (narrPanel !== except) narrPanel.hidden = true, narrToggle.setAttribute('aria-expanded', 'false');
  }

  // --- Background Music Handling ---
  var musicVol = parseInt(localStorage.getItem(MUSIC_VOL_KEY) || '60', 10);
  if (isNaN(musicVol)) musicVol = 60;
  volume.value = musicVol;
  audio.volume = musicVol / 100;
  var musicMuted = localStorage.getItem(MUSIC_MUTE_KEY) !== '0';

  function applyMusicState() {
    audio.muted = musicMuted;
    toggle.classList.toggle('is-muted', musicMuted);
    muteBtn.classList.toggle('is-muted', musicMuted);
    var label = musicMuted ? 'Unmute background music' : 'Mute background music';
    muteBtn.setAttribute('aria-pressed', String(musicMuted));
    muteBtn.setAttribute('aria-label', label);
    muteBtn.innerHTML = musicMuted ? ICON_MUSIC_OFF : ICON_MUSIC_ON;
  }
  applyMusicState();

  toggle.addEventListener('click', function (e) {
    e.stopPropagation();
    var show = panel.hidden;
    closePanels(show ? panel : null);
    panel.hidden = !show;
    toggle.setAttribute('aria-expanded', String(show));
  });

  muteBtn.addEventListener('click', function () {
    musicMuted = !musicMuted;
    localStorage.setItem(MUSIC_MUTE_KEY, musicMuted ? '1' : '0');
    applyMusicState();
    audio.play().catch(function () {});
  });

  volume.addEventListener('input', function () {
    var v = parseInt(volume.value, 10);
    audio.volume = v / 100;
    localStorage.setItem(MUSIC_VOL_KEY, String(v));
    if (v > 0 && musicMuted) {
      musicMuted = false;
      localStorage.setItem(MUSIC_MUTE_KEY, '0');
      applyMusicState();
      audio.play().catch(function () {});
    }
  });

  // --- Narration Audio Handling ---
  var narrVol = parseInt(localStorage.getItem(NARR_VOL_KEY) || '80', 10);
  if (isNaN(narrVol)) narrVol = 80;
  narrVolume.value = narrVol;
  narration.volume = narrVol / 100;
  var narrMuted = localStorage.getItem(NARR_MUTE_KEY) === '1';

  function applyNarrState() {
    narration.muted = narrMuted;
    narrToggle.classList.toggle('is-muted', narrMuted);
    narrMuteBtn.classList.toggle('is-muted', narrMuted);
    var label = narrMuted ? 'Unmute narration' : 'Mute narration';
    narrMuteBtn.setAttribute('aria-pressed', String(narrMuted));
    narrMuteBtn.setAttribute('aria-label', label);
    narrMuteBtn.innerHTML = narrMuted ? ICON_NARR_OFF : ICON_NARR_ON;
  }
  applyNarrState();

  narrToggle.addEventListener('click', function (e) {
    e.stopPropagation();
    var show = narrPanel.hidden;
    closePanels(show ? narrPanel : null);
    narrPanel.hidden = !show;
    narrToggle.setAttribute('aria-expanded', String(show));
  });

  narrMuteBtn.addEventListener('click', function () {
    narrMuted = !narrMuted;
    localStorage.setItem(NARR_MUTE_KEY, narrMuted ? '1' : '0');
    applyNarrState();
  });

  narrVolume.addEventListener('input', function () {
    var v = parseInt(narrVolume.value, 10);
    narration.volume = v / 100;
    localStorage.setItem(NARR_VOL_KEY, String(v));
    if (v > 0 && narrMuted) {
      narrMuted = false;
      localStorage.setItem(NARR_MUTE_KEY, '0');
      applyNarrState();
    }
  });

  document.addEventListener('pointerdown', function (e) {
    if (!panel.hidden && !panel.contains(e.target) && !toggle.contains(e.target)) {
      panel.hidden = true;
      toggle.setAttribute('aria-expanded', 'false');
    }
    if (!narrPanel.hidden && !narrPanel.contains(e.target) && !narrToggle.contains(e.target)) {
      narrPanel.hidden = true;
      narrToggle.setAttribute('aria-expanded', 'false');
    }
  });
})();

(function () {
  var container = document.getElementById('wfHeroCaption');
  var narration = document.getElementById('wfNarration');
  if (!container) return;

  var LINES = [
    'Long ago, the Apps of Power were forged, and scattered among the seekers of many kingdoms&hellip;',
    'One App for Progress, climbing toward the light,',
    'One for the Calories, counted plate by plate,',
    'One for the Miles run beneath the open sky,',
    'One for the Steps, the Water, and the Tribe close by &mdash;',
    'In the heart of Mount Doom, where the embers lie,',
    'One App was forged to rule them all, One App to find them,',
    'One App to bring them all and in your pocket&hellip;bind them,',
    'In the heart of Mount Doom, where the embers lie.',
    'Then it was lost.',
    'For centuries it lay hidden, until &mdash; through fitness logs and fumbled trackers, through six apps become sixty &mdash; the world grew desperate for what was forgotten.',
    'And so it has returned:',
    'Winfinity.',
    'The one App to rule them all.'
  ];
  var HOLD_MS = [5200, 2600, 2600, 2900, 3600, 3300, 4200, 3900, 3300, 1800, 8100, 1800, 1800];
  var FADE_MS = 1000;
  var REPEAT_GAP_MS = 7000;

  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduceMotion) {
    var finalLine = document.createElement('p');
    finalLine.className = 'wf-hero-caption-line is-final is-visible';
    finalLine.innerHTML = LINES[LINES.length - 1];
    container.appendChild(finalLine);
    return;
  }

  var i = 0;
  function showLine() {
    var isLast = i === LINES.length - 1;
    var isEmphasis = isLast || i === LINES.length - 2;
    var p = document.createElement('p');
    p.className = 'wf-hero-caption-line' + (isEmphasis ? ' is-final' : '');
    p.innerHTML = LINES[i];
    container.innerHTML = '';
    container.appendChild(p);
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { p.classList.add('is-visible'); });
    });
    if (isLast) return;
    setTimeout(function () {
      p.classList.remove('is-visible');
      setTimeout(function () { i++; showLine(); }, FADE_MS);
    }, HOLD_MS[i]);
  }

  var started = false;
  function start() {
    if (started) return;
    started = true;
    i = 0;
    showLine();
  }

  if (!narration) { start(); return; }

  var kicked = false;
  function kick() {
    if (kicked) return;
    kicked = true;
    document.removeEventListener('click', kick);
    document.removeEventListener('touchstart', kick);
    narration.play().catch(function () {});
    start();
  }
  document.addEventListener('click', kick, { once: true });
  document.addEventListener('touchstart', kick, { once: true });

  narration.addEventListener('ended', function () {
    var line = container.querySelector('.wf-hero-caption-line');
    if (line) line.classList.remove('is-visible');
    setTimeout(function () {
      narration.currentTime = 0;
      narration.play().catch(function () {});
      i = 0;
      showLine();
    }, REPEAT_GAP_MS);
  });
})();
</script>
