<!-- Winfinity hero embed for winfinityfitness.com (WordPress) — paste this
     whole block into a Custom HTML widget/block wherever the hero/top
     section should go. Fragment, not a full page, same convention as
     footer-embed.html -- inherits the page's own width.

     CTA button ("Launch Nexus") is a fixed, static link straight to the
     live Wellness dashboard -- deliberately NOT synced to the Digital
     Arsenal's Wellness download-icon link (ad_settings.download_url_
     wellness), which points at the installer file instead. Two different
     destinations by design: this button launches the live app, Arsenal's
     downloads the installer. No Supabase fetch needed here at all.

     Second CTA ("Fitness Adventure") links to adventure.winfinityfitness.com
     -- a standalone static page (adventure-guide.html in the fitness-tracker
     repo, served through the same wordpress-proxy used by Wellness/Messenger,
     see wordpress-proxy/index.php's host branch) walking through the in-app
     Fitness RPG / Adventure Map feature. Outline style so it reads as the
     secondary action next to Launch Nexus. -->
<section class="wf-hero-embed" id="wfHeroEmbed">
  <img class="wf-hero-logo" src="https://winfinityfitness.github.io/fitness-tracker/icons/wf-logo-3d.png" alt="Winfinity">
  <h1 class="wf-hero-title">The Future Of<br><em>Performance</em></h1>
  <p class="wf-hero-subtitle">Unlock your latent potential through the Global Neural Grid. Real-time bio-syncing for the modern shinobi.</p>
  <div class="wf-hero-cta-row">
    <a class="wf-hero-cta" href="https://wellness.winfinityfitness.com" target="_blank" rel="noopener">Launch Nexus</a>
    <a class="wf-hero-cta wf-hero-cta--ghost" href="https://adventure.winfinityfitness.com" target="_blank" rel="noopener">Fitness Adventure</a>
  </div>
</section>

<style>
  .wf-hero-embed {
    background: #0a0d12; text-align: center; padding: 64px 24px 72px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  .wf-hero-logo {
    /* Sized to match the Adventure guide's hero seal (.hero-seal-frame,
       adventure-guide.html) so the same logo reads consistently large
       across both pages. */
    width: 252px; height: 252px; object-fit: contain; margin: 0 auto 28px; display: block;
    animation: wf-hero-glow-pulse 2.4s ease-in-out infinite alternate;
  }
  @keyframes wf-hero-glow-pulse {
    from { filter: drop-shadow(0 0 10px rgba(255,159,67,0.4)); }
    to   { filter: drop-shadow(0 0 26px rgba(255,159,67,0.85)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .wf-hero-logo { animation: none; filter: drop-shadow(0 0 18px rgba(255,159,67,0.55)); }
  }
  /* !important + explicit font-family throughout, same defensive pattern
     as .wf-footer-name -- WordPress themes commonly re-style bare h1-h6
     (and em inside them) with their own font-family/font-style/color at
     higher specificity than a single class can beat on its own. */
  .wf-hero-embed .wf-hero-title {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
    color: #e8ecf1 !important; font-size: clamp(1.8rem, 5vw, 2.6rem) !important; font-weight: 800 !important;
    font-style: normal !important; text-transform: uppercase; line-height: 1.2; margin: 0 0 18px; letter-spacing: 0.04em;
  }
  .wf-hero-embed .wf-hero-title em {
    font-family: inherit !important; display: block; color: #ff9f43 !important;
    font-style: normal !important; font-weight: 800 !important;
  }
  .wf-hero-subtitle {
    color: #8a97a8; font-size: 0.92rem; line-height: 1.6; max-width: 480px;
    margin: 0 auto 32px;
  }
  .wf-hero-cta-row {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 16px;
  }
  .wf-hero-cta {
    display: inline-block; background: #ff9f43; color: #0a0d12; text-decoration: none;
    font-weight: 700; font-size: 0.85rem; letter-spacing: 0.03em; text-transform: uppercase;
    padding: 14px 32px; clip-path: polygon(4% 0, 100% 0, 96% 100%, 0 100%);
    box-sizing: border-box; min-width: 230px; text-align: center; position: relative;
  }
  .wf-hero-cta:hover { background: #ffb668; }
  /* A real border/box-shadow can't follow clip-path's diagonal cut edges
     at all -- clip-path only crops pixels, it never draws a stroke along
     the new cut line, so both approaches leave the slanted sides bare
     (the bug in the last fix). The only way to get an outline that
     actually follows every edge, including the diagonals, is a "clipped
     picture frame": this element's own background IS the outline color
     (inheriting .wf-hero-cta's orange fill + clip-path above), and a
     ::before inset by the border width, clipped to the same shape, sits
     on top in the page's own background color to punch out the middle. */
  .wf-hero-cta--ghost { color: #ff9f43 !important; }
  .wf-hero-cta--ghost::before {
    content: ''; position: absolute; inset: 1.5px; z-index: -1;
    background: #0a0d12; clip-path: polygon(4% 0, 100% 0, 96% 100%, 0 100%);
  }
  .wf-hero-cta--ghost:hover::before { background: #271d1b; }
</style>
